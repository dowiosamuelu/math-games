<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>數學遊戲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&display=swap">
<style>
:root{
  --bg:#F2F6FB; --ink:#25313F; --muted:#6A7686; --line:#D9E1EB; --white:#FFFFFF;
  --green:#28B47E; --green-l:#E2F7EE; --sun:#FFB21E; --sun-d:#D88D00; --sun-l:#FFF3D6;
  --sky:#38A6EF; --sky-l:#E1F1FD; --grape:#8A63E8; --grape-l:#EEE7FD;
  --coral:#FF6A57; --coral-l:#FFE8E4; --teal:#14A7A0; --teal-l:#DCF4F2;
  --f-ui:"Huninn","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-title:"LXGW WenKai TC","Kaiti TC","BiauKai",serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:28px max(18px,env(safe-area-inset-right)) 40px max(18px,env(safe-area-inset-left))}
h1{font-family:var(--f-title);font-size:2.3rem;margin:0;line-height:1.15}
.sub{margin:6px 0 0;color:var(--muted)}
h2{font-size:1.05rem;margin:30px 0 12px;color:var(--muted);font-weight:400;letter-spacing:.08em}
.games{display:flex;flex-direction:column;gap:14px}
.gcard{display:flex;align-items:center;gap:14px;background:var(--white);border:2px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 5px 0 var(--line);color:var(--ink);text-decoration:none;transition:transform .08s}
.gcard:active{transform:translateY(5px);box-shadow:none}
.gcard:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.icon{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:1.5rem;font-weight:700;background:var(--cl);color:var(--c)}
.body{flex:1;min-width:0}
.name{margin:0;font-size:1.2rem}
.desc{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{font-size:.8rem;padding:2px 10px;border-radius:999px;background:var(--cl);color:var(--ink)}
.go{flex:none;color:var(--c);font-size:1.4rem}
footer{margin-top:40px;text-align:center;font-size:.9rem}
footer a{color:var(--muted)}
.green{--c:var(--green);--cl:var(--green-l)} .sun{--c:var(--sun-d);--cl:var(--sun-l)} .sky{--c:var(--sky);--cl:var(--sky-l)}
.grape{--c:var(--grape);--cl:var(--grape-l)} .coral{--c:var(--coral);--cl:var(--coral-l)} .teal{--c:var(--teal);--cl:var(--teal-l)}
</style>
</head>
<body>
<main class="wrap">
  <h1>數學遊戲</h1>
  <p class="sub">選一個遊戲開始玩</p>

  <h2>課內</h2>
  <div class="games">
    <a class="gcard sky" href="term-detective/">
      <div class="icon" aria-hidden="true">名</div>
      <div class="body">
        <p class="name">名詞偵探</p>
        <p class="desc">先認得名詞，才看得懂題目在問什麼</p>
        <div class="chips"><span>名詞配對</span><span>看題目選工具</span><span>看算式選規則</span></div>
      </div>
      <span class="go" aria-hidden="true">›</span>
    </a>
    <a class="gcard green" href="number-line-walk/">
      <div class="icon" aria-hidden="true">±</div>
      <div class="body">
        <p class="name">數線走走看</p>
        <p class="desc">在數線上一步一步走，算正負數的加減</p>
      </div>
      <span class="go" aria-hidden="true">›</span>
    </a>
    <a class="gcard grape" href="exponent-tower/">
      <div class="icon" aria-hidden="true">x²</div>
      <div class="body">
        <p class="name">指數塔</p>
        <p class="desc">從 1 樓開始，一層一層往上爬</p>
      </div>
      <span class="go" aria-hidden="true">›</span>
    </a>
    <a class="gcard teal" href="cosmic-elevator/">
      <div class="icon" aria-hidden="true">10ⁿ</div>
      <div class="body">
        <p class="name">宇宙電梯</p>
        <p class="desc">每一層樓都是 10 的次方，寫成科學記號</p>
      </div>
      <span class="go" aria-hidden="true">›</span>
    </a>
  </div>

  <h2>課外</h2>
  <div class="games">
    <a class="gcard sun" href="structure-detective/">
      <div class="icon" aria-hidden="true">?</div>
      <div class="body">
        <p class="name">結構偵探</p>
        <p class="desc">分類、找規則、換個角度看</p>
        <div class="chips"><span>找不同</span><span>規則偵探</span><span>兩種分法</span></div>
      </div>
      <span class="go" aria-hidden="true">›</span>
    </a>
    <a class="gcard coral" href="donut-coloring/">
      <div class="icon" aria-hidden="true">◎</div>
      <div class="body">
        <p class="name">甜甜圈塗色</p>
        <p class="desc">相鄰的兩塊不能同色，最少要幾種顏色？</p>
      </div>
      <span class="go" aria-hidden="true">›</span>
    </a>
  </div>

  <footer><a href="https://github.com/dowiosamuelu">github.com/dowiosamuelu</a></footer>
</main>
</body>
</html>
